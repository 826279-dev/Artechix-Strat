<!DOCTYPE html>
<html>
<head>
  <title>Race Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      background: #111827;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .container {
      padding: 40px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: #1f2937;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #ef4444;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #dc2626;
    }

    .result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div style="max-width:400px;margin:40px auto;padding:20px;background:#111;border-radius:12px;color:white;text-align:center;">
  <h2>RaceCalc Account</h2>
  <input type="email" id="email" placeholder="Email" style="width:100%;padding:10px;margin:10px 0;border-radius:6px;border:none;">
  <input type="password" id="password" placeholder="Password" style="width:100%;padding:10px;margin:10px 0;border-radius:6px;border:none;">
  <button onclick="register()" style="width:48%;padding:10px;margin:5px;background:#00c853;border:none;border-radius:6px;color:white;">Register</button>
  <button onclick="login()" style="width:48%;padding:10px;margin:5px;background:#2962ff;border:none;border-radius:6px;color:white;">Login</button>
</div>
  
<header>RaceCalc</header>

<div class="container">

  <div class="card">
    <h2>Fuel Strategy Calculator</h2>

    <label>Race Length (laps)</label>
    <input type="number" id="raceLength">

    <label>Fuel Per Lap (liters)</label>
    <input type="number" id="fuelPerLap">

    <label>Tank Size (liters)</label>
    <input type="number" id="tankSize">

    <label>Fuel Margin (liters)</label>
    <input type="number" id="fuelMargin">

    <button onclick="calculate()">Calculate Strategy</button>
    <button onclick="saveStrategy()">Save Strategy</button>

    <div class="result" id="result"></div>
  </div>

</div>

<script>
function calculate() {
  async function saveStrategy() {
  const data = {
    raceLength: document.getElementById("raceLength").value,
    fuelPerLap: document.getElementById("fuelPerLap").value,
    tankSize: document.getElementById("tankSize").value,
    fuelMargin: document.getElementById("fuelMargin").value,
    time: new Date().toISOString()
  };

  const res = await fetch("/api/save", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  const result = await res.json();
  alert(result.message + " | Total saved: " + result.total);
}
  const raceLength = parseFloat(document.getElementById("raceLength").value);
  const fuelPerLap = parseFloat(document.getElementById("fuelPerLap").value);
  const tankSize = parseFloat(document.getElementById("tankSize").value);
  const fuelMargin = parseFloat(document.getElementById("fuelMargin").value);

  if (!raceLength || !fuelPerLap || !tankSize) {
    alert("Fill all required fields");
    return;
  }

  const totalFuelNeeded = (raceLength * fuelPerLap) + (fuelMargin || 0);
  const stops = Math.ceil(totalFuelNeeded / tankSize) - 1;

  document.getElementById("result").innerText =
    "Total Fuel Needed: " + totalFuelNeeded.toFixed(2) + " L | Estimated Stops: " + stops;
}

async function register() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const res = await fetch('/api/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();
  alert(data.message || data.error);
}

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });

  if (res.status === 200) {
    alert('Login successful');
  } else {
    alert('Invalid credentials');
  }
}
</script>

</body>
</html>
